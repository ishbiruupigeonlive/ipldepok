<div class="navbar"><h1>🏁 Race Management</h1><a href="index.html" class="back-link">← Kembali</a></div>
<div class="container">
  <div class="card">
    <div id="statusMsg" class="status-msg"></div>
    <form id="raceForm">
      <label>Nama Lomba</label><input name="raceName" required>
      <label>Tanggal</label><input name="date" type="date" required>
      <label>Jarak (meter)</label><input name="distance" type="number" required>
      <label>Waktu Rilis</label><input name="releaseTime" type="datetime-local" required>
      <button type="submit">Buat Lomba</button>
    </form>
  </div>
  <div class="card"><h3>Daftar Lomba</h3><div id="tableWrap"></div></div>
</div>
<script>
const API = "https://script.google.com/macros/s/AKfycbzM0l5CSIXmguSC2xifWuoV40pSxB8E0spVzM7iwzD57A0j08kuMVyzy-lmm6lAt_lQKg/exec";
document.getElementById("raceForm").onsubmit = async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  data.action = "createRace";
  await fetch(API, {method:"POST", body: JSON.stringify(data)});
  e.target.reset();
  loadRaces();
};
async function loadRaces() {
  const res = await fetch(`${API}?sheet=Races`);
  const rows = (await res.json()).slice(1);
  document.getElementById("tableWrap").innerHTML = rows.length ?
    `<table><thead><tr><th>ID</th><th>Nama</th><th>Tanggal</th><th>Jarak</th><th>Status</th></tr></thead><tbody>${
      rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[5]}</td></tr>`).join("")
    }</tbody></table>` : `<div class="empty-state">Belum ada lomba.</div>`;
}
loadRaces();
</script>
