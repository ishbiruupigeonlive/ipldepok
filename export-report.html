<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export/Report - Ishbiruu Pigeon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <h1>📄 Export/Report</h1>
    <a href="index.html" class="back-link">← Kembali</a>
  </div>
  <div class="container">
    <div class="card">
      <label>Pilih Data</label>
      <select id="sheetSelect">
        <option value="Pigeons">Data Merpati</option>
        <option value="Health">Riwayat Kesehatan</option>
        <option value="RaceResults">Hasil Lomba</option>
        <option value="Members">Data Anggota</option>
      </select>
      <button onclick="exportCSV()" style="margin-top:16px;">⬇️ Export CSV</button>
    </div>
  </div>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbzM0l5CSIXmguSC2xifWuoV40pSxB8E0spVzM7iwzD57A0j08kuMVyzy-lmm6lAt_lQKg/exec";
    function exportCSV() {
      const sheet = document.getElementById("sheetSelect").value;
      window.open(`${API}?action=export&sheet=${sheet}`, "_blank");
    }
  </script>
</body>
</html>
