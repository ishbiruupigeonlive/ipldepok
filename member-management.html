<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Management - Ishbiruu Pigeon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <h1>👥 Member Management</h1>
    <a href="index.html" class="back-link">← Kembali</a>
  </div>
  <div class="container">
    <div class="card">
      <div id="statusMsg" class="status-msg"></div>
      <form id="memberForm">
        <label>Member ID</label>
        <input name="memberId" placeholder="Contoh: MB001" required>

        <label>Nama Anggota</label>
        <input name="name" placeholder="Nama lengkap" required>

        <label>Kontak</label>
        <input name="contact" placeholder="No. HP / Email" required>

        <label>Nama Klub</label>
        <input name="clubName" placeholder="Nama klub" required>

        <button type="submit" id="submitBtn">Simpan Anggota</button>
      </form>
    </div>

    <div class="card">
      <h3 style="margin-bottom:16px;">Daftar Anggota</h3>
      <div id="tableWrap">
        <div class="empty-state"><span class="spinner"></span> Memuat data...</div>
      </div>
    </div>
  </div>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbzM0l5CSIXmguSC2xifWuoV40pSxB8E0spVzM7iwzD57A0j08kuMVyzy-lmm6lAt_lQKg/exec";
    const form = document.getElementById("memberForm");
    const statusMsg = document.getElementById("statusMsg");
    const submitBtn = document.getElementById("submitBtn");
    const tableWrap = document.getElementById("tableWrap");

    function showStatus(type, message) {
      statusMsg.className = `status-msg ${type}`;
      statusMsg.innerHTML = type === "loading" ? `<span class="spinner"></span>${message}` : message;
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      data.action = "addMember";

      submitBtn.disabled = true;
      showStatus("loading", "Menyimpan data...");

      try {
        await fetch(API, { method: "POST", body: JSON.stringify(data) });
        showStatus("success", "✅ Anggota berhasil disimpan!");
        form.reset();
        loadMembers();
      } catch (err) {
        showStatus("error", "❌ Gagal menyimpan data. Coba lagi.");
      } finally {
        submitBtn.disabled = false;
      }
    };

    async function loadMembers() {
      try {
        const res = await fetch(`${API}?sheet=Members`);
        const rows = await res.json();
        const data = rows.slice(1);

        if (data.length === 0) {
          tableWrap.innerHTML = `<div class="empty-state">Belum ada anggota terdaftar.</div>`;
          return;
        }

        let html = `<table><thead><tr><th>ID</th><th>Nama</th><th>Kontak</th><th>Klub</th></tr></thead><tbody>`;
        data.forEach(r => {
          html += `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`;
        });
        html += `</tbody></table>`;
        tableWrap.innerHTML = html;
      } catch (err) {
        tableWrap.innerHTML = `<div class="empty-state">Gagal memuat data. <a href="javascript:loadMembers()">Coba lagi</a></div>`;
      }
    }
    loadMembers();
  </script>
</body>
</html>
