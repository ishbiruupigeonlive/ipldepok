<form id="pigeonForm">
  <input name="ringNumber" placeholder="Ring Number" required>
  <input name="name" placeholder="Nama Merpati" required>
  <select name="gender"><option>Jantan</option><option>Betina</option></select>
  <input name="birthDate" type="date" required>
  <input name="pedigree" placeholder="Pedigree/Keturunan">
  <input name="ownerId" placeholder="Owner ID" required>
  <button type="submit">Simpan</button>
</form>

<table id="pigeonTable"><thead><tr><th>Ring</th><th>Nama</th><th>Gender</th><th>Lahir</th><th>Pedigree</th></tr></thead><tbody></tbody></table>

<script>
const API = "https://script.google.com/macros/s/AKfycbzM0l5CSIXmguSC2xifWuoV40pSxB8E0spVzM7iwzD57A0j08kuMVyzy-lmm6lAt_lQKg/exec";

document.getElementById("pigeonForm").onsubmit = async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  data.action = "addPigeon";
  await fetch(API, {method:"POST", body: JSON.stringify(data)});
  alert("Merpati tersimpan!");
  loadPigeons();
};

async function loadPigeons() {
  const res = await fetch(`${API}?sheet=Pigeons`);
  const rows = await res.json();
  const tbody = document.querySelector("#pigeonTable tbody");
  tbody.innerHTML = "";
  rows.slice(1).forEach(r => {
    tbody.innerHTML += `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`;
  });
}
loadPigeons();
</script>
