<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Record - Ishbiruu Pigeon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <h1>💉 Health Record</h1>
    <a href="index.html" class="back-link">← Kembali</a>
  </div>
  <div class="container">
    <div class="card">
      <div id="statusMsg" class="status-msg"></div>
      <form id="healthForm">
        <label>Ring Number</label>
        <input name="ringNumber" placeholder="Contoh: ID-2024-001" required>

        <label>Tanggal</label>
        <input name="date" type="date" required>

        <label>Catatan Kesehatan</label>
        <input name="note" placeholder="Contoh: Vaksinasi rutin" required>

        <label>Jenis Vaksin</label>
        <input name="vaccineType" placeholder="Opsional">

        <button type="submit" id="submitBtn">Simpan Catatan</button>
      </form>
    </div>

    <div class="card">
      <h3 style="margin-bottom:16px;">Riwayat Kesehatan</h3>
      <div id="tableWrap">
        <div class="empty-state"><span class="spinner"></span> Memuat data...</div>
      </div>
    </div>
  </div>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbzM0l5CSIXmguSC2xifWuoV40pSxB8E0spVzM7iwzD57A0j08kuMVyzy-lmm6lAt_lQKg/exec";
    const form = document.getElementById("healthForm");
    const statusMsg = document.getElementById("statusMsg");
    const submitBtn = document.getElementById("submitBtn");
    const tableWrap = document.getElementById("tableWrap");

    function showStatus(type, message) {
      statusMsg.className = `status-msg ${type}`;
      statusMsg.innerHTML = type === "loading" ? `<span class="spinner"></span>${message}` : message;
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      data.action = "addHealth";

      submitBtn.disabled = true;
      showStatus("loading", "Menyimpan data...");

      try {
        await fetch(API, { method: "POST", body: JSON.stringify(data) });
        showStatus("success", "✅ Catatan kesehatan tersimpan!");
        form.reset();
        loadHealth();
      } catch (err) {
        showStatus("error", "❌ Gagal menyimpan data. Coba lagi.");
      } finally {
        submitBtn.disabled = false;
      }
    };

    async function loadHealth() {
      try {
        const res = await fetch(`${API}?sheet=Health`);
        const rows = await res.json();
        const data = rows.slice(1);

        if (data.length === 0) {
          tableWrap.innerHTML = `<div class="empty-state">Belum ada catatan kesehatan.</div>`;
          return;
        }

        let html = `<table><thead><tr><th>Ring</th><th>Tanggal</th><th>Catatan</th><th>Vaksin</th></tr></thead><tbody>`;
        data.forEach(r => {
          html += `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3] || '-'}</td></tr>`;
        });
        html += `</tbody></table>`;
        tableWrap.innerHTML = html;
      } catch (err) {
        tableWrap.innerHTML = `<div class="empty-state">Gagal memuat data. <a href="javascript:loadHealth()">Coba lagi</a></div>`;
      }
    }
    loadHealth();
  </script>
</body>
</html>
